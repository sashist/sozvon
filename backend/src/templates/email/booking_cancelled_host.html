<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Гость отменил запись</title>
</head>

<body style="margin:0; padding:0; background:#f0f4f8; font-family:'Segoe UI',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f0f4f8;">
    <tr>
      <td align="center" style="padding:40px 12px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"
          style="width:560px; max-width:560px; background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,0.08);">

          <!-- header -->
          <tr>
            <td align="center" bgcolor="#f59e0b"
              style="background:#f59e0b; background:linear-gradient(135deg,#f59e0b,#ea580c); padding:36px 40px;">
              <h1 style="margin:0; color:#ffffff; font-size:22px; font-weight:700;">⚠️ Гость отменил запись</h1>
              <p style="margin:8px 0 0; color:#ffe8cc; font-size:14px;">Sozvon — сервис онлайн-бронирования</p>
            </td>
          </tr>

          <!-- body -->
          <tr>
            <td style="padding:36px 40px;">
              <p style="font-size:16px; color:#1e293b; margin:0 0 20px;">Здравствуйте,
                <strong>{{ host_name }}</strong>!</p>

              <!-- details card -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; margin:0 0 20px;">
                <tr>
                  <td style="padding:14px 24px; border-bottom:1px solid #e2e8f0;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="font-size:14px; color:#64748b;">Встреча</td>
                        <td align="right" style="font-size:14px; color:#1e293b; font-weight:600;">{{ event_title }}</td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="padding:14px 24px; border-bottom:1px solid #e2e8f0;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="font-size:14px; color:#64748b;">Гость</td>
                        <td align="right" style="font-size:14px; color:#1e293b; font-weight:600; word-break:break-all;">{{ guest_name }} ({{ guest_email }})</td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="padding:14px 24px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="font-size:14px; color:#64748b;">Дата и время</td>
                        <td align="right" style="font-size:14px; color:#1e293b; font-weight:600;">{{ start_time }}</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <!-- reason -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                style="background:#fff7ed; border:1px solid #fed7aa; border-radius:10px; margin:0;">
                <tr>
                  <td style="padding:14px 18px; font-size:14px; color:#9a3412;">
                    <strong>Причина:</strong> {{ cancellation_reason }}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- footer -->
          <tr>
            <td align="center" bgcolor="#f8fafc"
              style="background:#f8fafc; border-top:1px solid #e2e8f0; padding:20px 40px; font-size:12px; color:#94a3b8;">
              Это автоматическое письмо, отвечать на него не нужно.<br />
              © Sozvon
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>

</html>
