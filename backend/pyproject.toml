[project]
name = "sozvon"
version = "1.0.0"
description = "Open-source self-hosted meeting scheduling service (Calendly / Planerka / Cal.com alternative)"
requires-python = ">=3.13"
keywords = [
    "calendly",
    "calendly-alternative",
    "planerka",
    "cal-com",
    "meeting-scheduler",
    "booking-system",
    "appointment-scheduling",
    "fastapi",
    "sozvon",
]
dependencies = [
    "alembic>=1.18.1",
    "bcrypt==4.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.128.0",
    "fastapi-mail>=1.6.2",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.3.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.2.1",
    "sqlalchemy[asyncio]>=2.0.45",
    "unidecode>=1.4.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-dotenv>=0.5.2",
    "httpx>=0.28.0",
]
